services:
  - type: web
    name: motionstudio-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_STT_MODEL_ID
        value: scribe_v2
      - key: DATABASE_URL
        sync: false
